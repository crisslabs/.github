<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" width="100%" height="100%">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <linearGradient id="stagingStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="pipelineStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="prodStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <filter id="dotGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .font-sans {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .font-mono {
      font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
    }
    .flow-line {
      stroke-dasharray: 8 6;
      animation: flowDash 1.8s linear infinite;
    }
    .pulse-dot {
      animation: pulse 2s ease-in-out infinite;
    }
    .spin-gear {
      transform-origin: 450px 86px;
      animation: spin 10s linear infinite;
    }
    @keyframes flowDash {
      to { stroke-dashoffset: -28; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
  </style>

  <!-- Background Frame -->
  <rect width="900" height="230" rx="16" fill="#090D16" stroke="#1E293B" stroke-width="1.5" />

  <!-- Connecting Animated Pipelines -->
  <!-- Line 1: Staging -> Engine -->
  <line x1="295" y1="115" x2="365" y2="115" stroke="url(#pipelineStroke)" stroke-width="2.5" class="flow-line" />
  <circle r="4" fill="#38BDF8" filter="url(#dotGlow)">
    <animateMotion dur="2.2s" repeatCount="indefinite" path="M 295 115 L 365 115" />
  </circle>

  <!-- Line 2: Engine -> Production -->
  <line x1="535" y1="115" x2="605" y2="115" stroke="url(#pipelineStroke)" stroke-width="2.5" class="flow-line" />
  <circle r="4" fill="#10B981" filter="url(#dotGlow)">
    <animateMotion dur="2.2s" begin="1.1s" repeatCount="indefinite" path="M 535 115 L 605 115" />
  </circle>

  <!-- NODE 1: STAGING LAB (crisslabs.tech) -->
  <g transform="translate(25, 25)">
    <rect width="270" height="180" rx="12" fill="url(#cardBg)" stroke="url(#stagingStroke)" stroke-width="1.5" />
    <circle cx="24" cy="28" r="5" fill="#F59E0B" class="pulse-dot" />
    <text x="38" y="32" fill="#F59E0B" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">
      STAGING &amp; SANDBOX
    </text>
    <text x="20" y="64" fill="#F8FAFC" font-size="20" font-weight="800" class="font-mono">
      crisslabs.tech
    </text>
    <text x="20" y="92" fill="#94A3B8" font-size="12.5" class="font-sans">
      • Pruebas de concepto (PoC)
    </text>
    <text x="20" y="114" fill="#94A3B8" font-size="12.5" class="font-sans">
      • Entornos pre-release y QA
    </text>
    <text x="20" y="136" fill="#94A3B8" font-size="12.5" class="font-sans">
      • Microservicios experimentales
    </text>
    <rect x="20" y="148" width="132" height="20" rx="5" fill="#1E293B" />
    <text x="28" y="162" fill="#C084FC" font-size="10.5" class="font-mono">env: experimental</text>
  </g>

  <!-- NODE 2: CLOUD & CI/CD PIPELINE -->
  <g transform="translate(365, 38)">
    <rect width="170" height="154" rx="12" fill="#0F172A" stroke="#334155" stroke-width="1.5" />
    <text x="85" y="102" text-anchor="middle" fill="#E2E8F0" font-size="13" font-weight="700" class="font-sans">
      Cloud &amp; CI/CD
    </text>
    <text x="85" y="122" text-anchor="middle" fill="#64748B" font-size="11" class="font-mono">
      Docker · Cloudflare
    </text>
    <text x="85" y="138" text-anchor="middle" fill="#38BDF8" font-size="10.5" class="font-mono">
      Automated Build
    </text>
  </g>
  <!-- Rotating Orbit Ring inside Center Node -->
  <g class="spin-gear">
    <circle cx="450" cy="86" r="22" fill="none" stroke="#38BDF8" stroke-width="2" stroke-dasharray="14 8" />
    <circle cx="450" cy="86" r="12" fill="none" stroke="#A855F7" stroke-width="2" stroke-dasharray="8 6" />
  </g>
  <circle cx="450" cy="86" r="4" fill="#10B981" />

  <!-- NODE 3: PRODUCTION (heycriss.dev) -->
  <g transform="translate(605, 25)">
    <rect width="270" height="180" rx="12" fill="url(#cardBg)" stroke="url(#prodStroke)" stroke-width="1.5" />
    <circle cx="24" cy="28" r="5" fill="#10B981" class="pulse-dot" />
    <text x="38" y="32" fill="#10B981" font-size="11" font-weight="700" letter-spacing="1" class="font-mono">
      PRODUCTION &amp; BRAND
    </text>
    <text x="20" y="64" fill="#F8FAFC" font-size="20" font-weight="800" class="font-mono">
      heycriss.dev
    </text>
    <text x="20" y="92" fill="#94A3B8" font-size="12.5" class="font-sans">
      • Plataformas y releases estables
    </text>
    <text x="20" y="114" fill="#94A3B8" font-size="12.5" class="font-sans">
      • Portafolio oficial y casos reales
    </text>
    <text x="20" y="136" fill="#94A3B8" font-size="12.5" class="font-sans">
      • Herramientas Open Source listas
    </text>
    <rect x="20" y="148" width="118" height="20" rx="5" fill="#1E293B" />
    <text x="28" y="162" fill="#38BDF8" font-size="10.5" class="font-mono">status: online</text>
  </g>
</svg>
